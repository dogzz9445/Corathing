name: Wpf Continuous Delivery

# git tag 푸시 시 릴리스 빌드를 생성한다.
#   git tag 1.0.0
#   git push origin --tags
on:
  push:
    tags:
      - '*'

jobs:
  build:
    strategy:
      matrix:
        targetplatform: [x64]

    runs-on: windows-latest

    env:
      Solution_Path: Corathing.sln
      Wpf_Project_Path: src\Apps\Corathing.Organizer.WPF\Corathing.Organizer.WPF.csproj

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Use Nerdbank.GitVersioning to set version variables
      uses: dotnet/nbgv@master
      id: nbgv

    - name: Install .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore
      run: dotnet restore ${{ env.Solution_Path }}

    - name: Publish WPF app (self-contained)
      run: dotnet publish ${{ env.Wpf_Project_Path }} --configuration Release --runtime win-${{ matrix.targetplatform }} --self-contained true --output publish

    - name: Archive publish output
      run: Compress-Archive -Path publish\* -DestinationPath Corathing.Organizer.WPF-${{ steps.nbgv.outputs.SimpleVersion }}-win-${{ matrix.targetplatform }}.zip

    - name: Create GitHub release
      uses: softprops/action-gh-release@v2
      with:
        files: Corathing.Organizer.WPF-${{ steps.nbgv.outputs.SimpleVersion }}-win-${{ matrix.targetplatform }}.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
