name: Wpf Continuous Integration

on:
  push:
    branches:
      - main
      - 'maintenance/*'
  pull_request:
    branches:
      - main

jobs:
  build:
    strategy:
      matrix:
        targetplatform: [x64]

    runs-on: windows-latest

    env:
      Solution_Path: Corathing.sln
      Wpf_Project_Path: src\Apps\Corathing.Organizer.WPF\Corathing.Organizer.WPF.csproj

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # nbgv 가 버전 계산하려면 shallow clone 불가

    - name: Use Nerdbank.GitVersioning to set version variables
      uses: dotnet/nbgv@master
      id: nbgv

    - name: Install .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore
      run: dotnet restore ${{ env.Solution_Path }}

    - name: Build (Debug)
      run: dotnet build ${{ env.Solution_Path }} --configuration Debug --no-restore

    # TODO: 단위 테스트 프로젝트가 추가되면 `dotnet test` 단계를 여기에 넣는다.

    - name: Publish WPF app
      run: dotnet publish ${{ env.Wpf_Project_Path }} --configuration Release --runtime win-${{ matrix.targetplatform }} --self-contained false --output ${{ github.workspace }}/publish

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Corathing.Organizer.WPF-${{ matrix.targetplatform }}
        path: ${{ github.workspace }}/publish
